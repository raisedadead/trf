name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Reject pre-launch vocabulary in shipped files
        run: |
          if git grep -In -i -e 'phase2' -e 'phase 2' -e 'phase-2' -- . ':(exclude).github/workflows/ci.yml' ; then
            echo "::error::Use 'post-launch', never 'phase 2', in tracked files."
            exit 1
          fi
      - run: pnpm format:check
      - run: pnpm check

  build:
    name: build (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stage: [launch, beta]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the same build command Cloudflare Workers Builds runs
        run: pnpm run build:${{ matrix.stage }}
        env:
          # Not a secret: the sitekey is public and is baked into every page. This
          # stand-in makes the deploy guard run exactly as it does in production —
          # it refuses Cloudflare's always-pass test key, so CI cannot use that.
          PUBLIC_TURNSTILE_SITEKEY: 0xCI00000000000000000000

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - name: Create the local D1 schema the signup path writes to
        run: pnpm wrangler d1 migrations apply trf-rupeefund --local
      - run: pnpm test:e2e
      - name: Keep the Playwright report when a run fails
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
